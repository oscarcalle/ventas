<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis películas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .app { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* Sign in */
    .signin-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 80vh; gap: 1.5rem;
    }
    .signin-screen h1 { font-size: 22px; font-weight: 400; color: #fff; }
    .signin-screen p { font-size: 14px; color: #666; }
    .btn-google {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 22px; border: 1px solid #333; border-radius: 8px;
      background: #1a1a1a; cursor: pointer; font-size: 14px; color: #e0e0e0;
      font-family: inherit; transition: background 0.15s;
    }
    .btn-google:hover { background: #222; }
    .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Player */
    .player-screen { display: none; flex-direction: column; gap: 1.25rem; }
    .video-wrap {
      position: relative; width: 100%; padding-bottom: 56.25%;
      background: #000; border-radius: 8px; overflow: hidden;
    }
    .video-wrap video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .placeholder span { font-size: 13px; color: #444; }

    .meta-bar {
      display: flex; justify-content: space-between; align-items: center;
    }
    .now-playing { font-size: 14px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
    .btn-signout {
      font-size: 12px; color: #555; background: none; border: none;
      cursor: pointer; font-family: inherit; flex-shrink: 0;
    }
    .btn-signout:hover { color: #888; }

    .section-label {
      font-size: 11px; color: #444; letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .file-list {
      display: flex; flex-direction: column; gap: 2px;
      max-height: 300px; overflow-y: auto;
    }
    .file-list::-webkit-scrollbar { width: 4px; }
    .file-list::-webkit-scrollbar-track { background: transparent; }
    .file-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .file-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid transparent; transition: background 0.1s;
    }
    .file-item:hover { background: #1a1a1a; border-color: #2a2a2a; }
    .file-item.active { background: #1a1a1a; border-color: #3a3a3a; }
    .file-name {
      font-size: 13px; color: #ccc; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 82%;
    }
    .file-size { font-size: 12px; color: #444; flex-shrink: 0; }
    .loading { font-size: 13px; color: #555; padding: 1rem; text-align: center; }
    .error-msg { font-size: 13px; color: #c0392b; padding: 1rem; text-align: center; }
  </style>
</head>
<body>
<div class="app">

  <div class="signin-screen" id="signinScreen">
    <h1>Mis películas</h1>
    <p>Inicia sesión con tu cuenta de Google para acceder a tus videos</p>
    <button class="btn-google" id="btnSignin">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar con Google
    </button>
  </div>

  <div class="player-screen" id="playerScreen">
    <div class="video-wrap">
      <div class="placeholder" id="placeholder">
        <span>Selecciona una película para reproducir</span>
      </div>
      <video id="videoEl" controls style="display:none;"></video>
    </div>
    <div class="meta-bar">
      <span class="now-playing" id="nowPlaying">—</span>
      <button class="btn-signout" id="btnSignout">Cerrar sesión</button>
    </div>
    <div class="section-label" style="margin-top:0.5rem;">Mis películas</div>
    <div class="file-list" id="fileList">
      <div class="loading">Cargando...</div>
    </div>
  </div>

</div>

<script>
const CLIENT_ID = '407406644928-v7bhie0f1uvu6ldcjrs5uclkrb87o631.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
const VIDEO_EXTS = /\.(mp4|mkv|avi|mov|webm|mpg|mpeg|m4v|flv|wmv)$/i;

let tokenClient, accessToken;

function loadGIS() {
  return new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = resolve;
    document.head.appendChild(s);
  });
}

async function init() {
  await loadGIS();
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { alert('Error de autenticación: ' + resp.error); return; }
      accessToken = resp.access_token;
      document.getElementById('signinScreen').style.display = 'none';
      document.getElementById('playerScreen').style.display = 'flex';
      await loadFiles();
    }
  });
  document.getElementById('btnSignin').addEventListener('click', () => tokenClient.requestAccessToken());
  document.getElementById('btnSignout').addEventListener('click', signout);
}

async function loadFiles() {
  const listEl = document.getElementById('fileList');
  listEl.innerHTML = '<div class="loading">Cargando archivos...</div>';
  try {
    const q = encodeURIComponent("mimeType contains 'video/' and trashed=false");
    const res = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,mimeType)&pageSize=100&orderBy=name`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    const data = await res.json();
    const files = (data.files || []).filter(f =>
      (f.mimeType && f.mimeType.startsWith('video/')) || VIDEO_EXTS.test(f.name)
    );
    if (!files.length) {
      listEl.innerHTML = '<div class="loading">No se encontraron videos en tu Drive.</div>';
      return;
    }
    listEl.innerHTML = '';
    files.forEach(f => {
      const item = document.createElement('div');
      item.className = 'file-item';
      const sizeStr = f.size
        ? (f.size > 1e9 ? (f.size / 1e9).toFixed(1) + ' GB' : Math.round(f.size / 1e6) + ' MB')
        : '';
      item.innerHTML = `<span class="file-name">${f.name}</span><span class="file-size">${sizeStr}</span>`;
      item.addEventListener('click', () => playFile(f, item));
      listEl.appendChild(item);
    });
  } catch (e) {
    listEl.innerHTML = '<div class="error-msg">Error al cargar archivos. Intenta recargar.</div>';
  }
}

function playFile(file, itemEl) {
  document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
  itemEl.classList.add('active');
  document.getElementById('nowPlaying').textContent = file.name;
  const videoEl = document.getElementById('videoEl');
  document.getElementById('placeholder').style.display = 'none';
  videoEl.style.display = 'block';
  videoEl.src = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&access_token=${accessToken}`;
  videoEl.play();
}

function signout() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null;
  document.getElementById('playerScreen').style.display = 'none';
  document.getElementById('signinScreen').style.display = 'flex';
  const videoEl = document.getElementById('videoEl');
  videoEl.pause();
  videoEl.src = '';
  videoEl.style.display = 'none';
  document.getElementById('placeholder').style.display = 'flex';
  document.getElementById('fileList').innerHTML = '<div class="loading">Cargando...</div>';
}

init();
</script>
</body>
</html>
